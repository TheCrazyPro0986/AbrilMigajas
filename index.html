* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 20% 20%, #61001e, transparent 35%),
        radial-gradient(circle at 80% 80%, #4b0018, transparent 35%),
        linear-gradient(135deg, #120006, #35000e, #090003);
}

/* CONTENEDOR */

.contenedor {
    position: relative;
    z-index: 5;

    width: min(90%, 700px);

    text-align: center;

    padding: 30px;

    border-radius: 30px;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.18);

    backdrop-filter: blur(14px);

    box-shadow:
        0 0 50px rgba(255,0,80,.3);
}

/* IMÁGENES */

.imagenes {
    display: flex;

    justify-content: center;

    gap: 20px;

    margin-bottom: 25px;
}

.imagenes img {
    width: 170px;
    height: 170px;

    object-fit: cover;

    border-radius: 20px;

    border: 3px solid white;

    box-shadow:
        0 0 25px rgba(255,40,100,.5);
}

/* TEXTO */

h1 {
    font-size: clamp(28px, 6vw, 48px);

    margin: 10px 0;

    text-shadow:
        0 0 15px #ff174f,
        0 0 30px #ff174f;
}

.subtitulo {
    opacity: .8;

    margin-bottom: 30px;
}

/* BOTONES */

.botones {
    position: relative;

    height: 150px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;
}

button {
    border: none;

    cursor: pointer;

    font-size: 20px;

    font-weight: bold;

    padding: 15px 30px;

    border-radius: 50px;

    transition:
        left .25s ease,
        top .25s ease,
        transform .25s ease;
}

/* SI */

#si {
    background: #ff174f;

    color: white;

    box-shadow:
        0 0 25px rgba(255,23,79,.7);

    transform: scale(1);

    z-index: 10;
}

/* NO */

#no {
    background: white;

    color: #222;

    position: relative;

    z-index: 20;
}

/* CORAZONES */

.corazon {
    position: fixed;

    bottom: -40px;

    pointer-events: none;

    animation: subir linear forwards;

    z-index: 1;
}

@keyframes subir {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}

/* LLUVIA */

.lluvia {
    position: fixed;

    top: -50px;

    pointer-events: none;

    z-index: 2;

    animation: caer linear forwards;
}

@keyframes caer {

    to {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}

/* RESPONSIVE */

@media(max-width:500px) {

    .imagenes img {
        width: 130px;
        height: 130px;
    }

    .contenedor {
        padding: 20px;
    }
}
