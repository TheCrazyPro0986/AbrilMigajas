<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una pregunta 💗</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #120006, #39000f, #100005);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 20% 20%, rgba(255, 30, 90, .20), transparent 30%),
            radial-gradient(circle at 80% 80%, rgba(255, 0, 70, .18), transparent 30%);
        pointer-events: none;
    }

    .contenedor {
        position: relative;
        z-index: 5;
        width: min(90%, 700px);
        text-align: center;
        padding: 30px;
        border-radius: 30px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 50px rgba(255, 0, 80, .25);
    }

    .imagenes {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .imagenes img {
        width: 170px;
        height: 170px;
        object-fit: cover;
        border-radius: 20px;
        border: 3px solid rgba(255,255,255,.8);
        box-shadow: 0 0 25px rgba(255, 40, 100, .4);
    }

    h1 {
        font-size: clamp(28px, 6vw, 48px);
        margin: 10px 0;
        text-shadow: 0 0 20px #ff3366;
    }

    .subtitulo {
        opacity: .8;
        margin-bottom: 30px;
    }

    .botones {
        position: relative;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
    }

    button {
        border: none;
        cursor: pointer;
        font-size: 20px;
        font-weight: bold;
        padding: 15px 30px;
        border-radius: 50px;
        transition: all .25s ease;
    }

    #si {
        background: #ff174f;
        color: white;
        box-shadow: 0 0 25px rgba(255, 23, 79, .7);
        transform: scale(1);
        z-index: 10;
    }

    #si:hover {
        filter: brightness(1.15);
    }

    #no {
        background: white;
        color: #222;
        position: relative;
        z-index: 20;
        transition:
            left .25s ease,
            top .25s ease,
            transform .25s ease;
    }

    .corazon {
        position: fixed;
        bottom: -40px;
        font-size: 20px;
        pointer-events: none;
        animation: subir linear forwards;
        z-index: 1;
    }

    @keyframes subir {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }

        10% {
            opacity: 1;
        }

        100% {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    .lluvia {
        position: fixed;
        top: -50px;
        pointer-events: none;
        z-index: 2;
        animation: caer linear forwards;
    }

    @keyframes caer {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    #mensaje {
        display: none;
        font-size: 28px;
        font-weight: bold;
        color: #ff6688;
        margin-top: 20px;
        animation: aparecer .6s ease;
    }

    @keyframes aparecer {
        from {
            transform: scale(.5);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    @media(max-width: 500px) {
        .imagenes img {
            width: 130px;
            height: 130px;
        }

        .contenedor {
            padding: 20px;
        }
    }
</style>

</head>

<body>

<div class="contenedor">

```
<div class="imagenes">

    <!-- CAMBIA ESTAS DOS IMÁGENES -->

    <img src="imagen1.jpg" alt="Imagen 1">

    <img src="imagen2.jpg" alt="Imagen 2">

</div>

<h1>
    ¿Quieres volver conmigo? 💗
</h1>

<div class="subtitulo">
    Piénsalo bien... 👀
</div>

<div class="botones">

    <button id="si">
        Sí 💗
    </button>

    <button id="no">
        No
    </button>

</div>

<div id="mensaje">
    Sabía que dirías que sí. 💗
</div>
```

</div>

<script>

const botonSi =
    document.getElementById("si");

const botonNo =
    document.getElementById("no");

const mensaje =
    document.getElementById("mensaje");


let escala = 1;

let contador = 0;


/* ==========================
   BOTÓN NO
========================== */

function escapar() {

    contador++;


    /*
       Cada vez que se intenta pulsar NO,
       el SI aumenta.
    */

    escala += 0.18;

    botonSi.style.transform =
        `scale(${escala})`;


    /*
       Hacemos que NO se mueva
       dentro de la pantalla.
    */

    const margen = 20;


    const maxX =
        window.innerWidth -
        botonNo.offsetWidth -
        margen;


    const maxY =
        window.innerHeight -
        botonNo.offsetHeight -
        margen;


    const x =
        Math.random() * maxX;


    const y =
        Math.random() * maxY;


    botonNo.style.position =
        "fixed";


    botonNo.style.left =
        `${x}px`;


    botonNo.style.top =
        `${y}px`;


    /*
       Cambiamos el texto después
       de varios intentos.
    */

    if (contador === 3) {

        botonNo.textContent =
            "¿Seguro? 🥺";
    }


    if (contador === 6) {

        botonNo.textContent =
            "No huyas 😭";
    }


    if (contador === 9) {

        botonNo.textContent =
            "Ya déjame 😭";
    }


    crearExplosionCorazones(8);
}


/*
   PC: escapar cuando el cursor
   se acerca.
*/

document.addEventListener(
    "mousemove",
    (e) => {

        const rect =
            botonNo.getBoundingClientRect();


        const centroX =
            rect.left +
            rect.width / 2;


        const centroY =
            rect.top +
            rect.height / 2;


        const distancia =
            Math.sqrt(

                Math.pow(
                    e.clientX - centroX,
                    2
                )

                +

                Math.pow(
                    e.clientY - centroY,
                    2
                )

            );


        if (distancia < 100) {

            escapar();
        }

    }
);


/*
   Celular: tocar NO también cuenta.
*/

botonNo.addEventListener(
    "touchstart",
    (e) => {

        e.preventDefault();

        escapar();
    }
);


botonNo.addEventListener(
    "click",
    (e) => {

        e.preventDefault();

        escapar();
    }
);


/* ==========================
   BOTÓN SÍ
========================== */

botonSi.addEventListener(
    "click",
    () => {

        botonSi.style.transform =
            "scale(1.3)";


        mensaje.style.display =
            "block";


        crearExplosionCorazones(40);


        /*
           Esperamos medio segundo para
           que se vea la explosión de
           corazones y después vamos
           a la segunda página.
        */

        setTimeout(() => {

            window.location.href =
                "segunda.html";

        }, 800);

    }
);


/* ==========================
   CORAZONES FLOTANTES
========================== */

function crearCorazon() {

    const corazon =
        document.createElement("div");


    corazon.className =
        "corazon";


    const corazones = [
        "❤️",
        "💗",
        "💖",
        "💕",
        "💘"
    ];


    corazon.textContent =
        corazones[
            Math.floor(
                Math.random() *
                corazones.length
            )
        ];


    corazon.style.left =
        Math.random() * 100 + "vw";


    corazon.style.fontSize =
        (15 + Math.random() * 30) +
        "px";


    corazon.style.animationDuration =
        (4 + Math.random() * 5) +
        "s";


    document.body.appendChild(
        corazon
    );


    setTimeout(() => {

        corazon.remove();

    }, 10000);
}


/* ==========================
   LLUVIA DE CORAZONES
========================== */

function crearLluvia() {

    const corazon =
        document.createElement("div");


    corazon.className =
        "lluvia";


    corazon.textContent =
        "💗";


    corazon.style.left =
        Math.random() * 100 + "vw";


    corazon.style.fontSize =
        (12 + Math.random() * 25) +
        "px";


    corazon.style.animationDuration =
        (3 + Math.random() * 4) +
        "s";


    document.body.appendChild(
        corazon
    );


    setTimeout(() => {

        corazon.remove();

    }, 8000);
}


/* ==========================
   EXPLOSIÓN
========================== */

function crearExplosionCorazones(
    cantidad
) {

    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        setTimeout(() => {

            crearCorazon();

        }, i * 30);

    }
}


/* Corazones normales */

setInterval(
    crearCorazon,
    500
);


/* Lluvia */

setInterval(
    crearLluvia,
    700
);

</script>

</body>
</html>
